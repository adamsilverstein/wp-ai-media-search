name: Update WordPress.org assets and readme

on:
  # Only push to wordpress.org when a release is published, never on a plain
  # push to main. Also available on demand so the listing can be corrected
  # between releases without cutting a new version.
  release:
    types: [released]
  workflow_dispatch:

jobs:
  trunk:
    name: Push to trunk
    runs-on: ubuntu-latest
    permissions:
      # Only needs to read the repository; deployment happens over SVN.
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update assets and readme
        uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # v2.2.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          # The action defaults to the repository name (wp-ai-media-search),
          # which is not the plugin slug.
          SLUG: ai-media-search
