name: Deploy to WordPress.org

on:
  release:
    types: [released]

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    permissions:
      # Needed to attach the generated zip file to the release.
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy plugin
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # v2.3.0
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          # The action defaults to the repository name (wp-ai-media-search),
          # which is not the plugin slug.
          SLUG: ai-media-search

      - name: Attach zip file to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
