name: Deploy to WordPress.org

on:
  release:
    types: [released]

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    permissions:
      # Needed to attach the generated zip file to the release.
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy plugin
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          # The action defaults to the repository name (wp-ai-media-search),
          # which is not the plugin slug.
          SLUG: ai-media-search

      - name: Attach zip file to the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
